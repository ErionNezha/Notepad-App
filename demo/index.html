<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad — Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f3f3f3;display:flex;flex-direction:column;height:100vh}
.menubar{background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 10px;height:42px;gap:2px}
.menubar .title{font-weight:600;margin-right:14px;color:#333}
.menu{position:relative}
.menu>button{background:none;border:none;padding:8px 12px;font-size:.9rem;cursor:pointer;border-radius:4px;color:#333}
.menu>button:hover,.menu.open>button{background:#e6f3ff}
.dropdown{position:absolute;top:100%;left:0;background:#fff;border:1px solid #ccc;border-radius:6px;box-shadow:0 4px 14px #0002;min-width:180px;display:none;z-index:10}
.menu.open .dropdown{display:block}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;font-size:.88rem;cursor:pointer;color:#333}
.dropdown button:hover{background:#e6f3ff}
.statusbar{background:#0078d4;color:#fff;font-size:.78rem;padding:5px 12px;display:flex;justify-content:space-between}
textarea{flex:1;border:none;outline:none;resize:none;padding:14px;font-family:Consolas,monospace;font-size:.95rem;line-height:1.6;background:#fff}
.note{background:#fff8e1;border-bottom:1px solid #f0e0a8;padding:8px 14px;font-size:.8rem;color:#8a6d1a}
footer{text-align:center;padding:10px;color:#888;font-size:.8rem;background:#fff;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="menubar">
  <span class="title">📝 Notepad</span>
  <div class="menu" id="fileMenu">
    <button onclick="toggleMenu(event)">File</button>
    <div class="dropdown">
      <button onclick="newFile()">📄 New</button>
      <button onclick="openFile()">📂 Open…</button>
      <button onclick="saveFile()">💾 Save</button>
      <button onclick="saveAsFile()">💾 Save As…</button>
    </div>
  </div>
</div>
<div class="note">💡 Version web i Notepad-it Python (tkinter) — e njëjta logjikë: New / Open / Save / Save As.</div>
<textarea id="editor" placeholder="Shkruaj këtu…"></textarea>
<input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">
<div class="statusbar"><span id="fname">Untitled</span><span id="stat">0 fjalë</span></div>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026</footer>
<script>
const ed=document.getElementById('editor'),fname=document.getElementById('fname'),stat=document.getElementById('stat');
let currentName=null;
function toggleMenu(e){e.stopPropagation();document.getElementById('fileMenu').classList.toggle('open');}
document.addEventListener('click',()=>document.getElementById('fileMenu').classList.remove('open'));
function newFile(){ed.value='';currentName=null;fname.textContent='Untitled';upd();}
function openFile(){document.getElementById('fileInput').click();}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ed.value=r.result;currentName=f.name;fname.textContent=f.name;upd();};
  r.readAsText(f);e.target.value='';
});
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function saveFile(){ if(currentName){download(currentName,ed.value);} else saveAsFile(); }
function saveAsFile(){ const n=prompt('Emri i file-it:','shenim.txt'); if(n){currentName=n;fname.textContent=n;download(n,ed.value);} }
function upd(){const w=ed.value.trim()?ed.value.trim().split(/\s+/).length:0;stat.textContent=w+' fjalë';}
ed.addEventListener('input',upd);upd();
</script>
</body>
</html>
